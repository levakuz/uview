# Every place a dependency can be declared, and one package in several of them.
[project]
name = "acme-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic~=2.7",
]

[project.optional-dependencies]
cli = [
    "click>=8",
    "httpx[http2]>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
lint = [
    "ruff==0.6.9",
]
docs = []
