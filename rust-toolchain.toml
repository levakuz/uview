# Pinned so local runs, the Stop hook and CI all use the same clippy. Newer releases add
# lints, and with `-D warnings` a floating `stable` would break CI on unchanged code.
# Upgrading is a deliberate PR that fixes whatever new lints appear.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["clippy", "rustfmt"]
