[package]
name = "uview"
version = "0.1.0"
edition = "2024"

[dependencies]
# `Paragraph::line_count`: how tall the project tile must be to show its text, wrapped.
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
color-eyre = "0.6.3"
crossterm = "0.29.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tui-input = "*"
tokio-util = "0.7.19"
# Matches workspace `members` and `exclude` as uv does: uv uses this crate, with its defaults.
glob = "0.3"
toml_edit = "0.25.15"
unicode-width = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy", "gzip"] }
pep440_rs = "0.7"
terminal-colorsaurus = "1.0.3"

[target.'cfg(unix)'.dependencies]
# Sends SIGINT to a cancelled `uv`. Already built for crossterm; this adds the process API.
rustix = { version = "1.1.4", features = ["process"] }

# The app owns a raw-mode terminal; see AGENTS.md "Code conventions".
[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
# UI components are always built through `new()`, never generically via `Default`.
new_without_default = "allow"
