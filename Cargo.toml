[package]
name = "uview"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30.0"
color-eyre = "0.6.3"
crossterm = "0.29.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tui-input = "*"
tokio-util = "0.7.19"

[target.'cfg(unix)'.dependencies]
# Sends SIGINT to a cancelled `uv`. Already built for crossterm; this adds the process API.
rustix = { version = "1.1.4", features = ["process"] }

# The app owns a raw-mode terminal; see AGENTS.md "Code conventions".
[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
# UI components are always built through `new()`, never generically via `Default`.
new_without_default = "allow"
