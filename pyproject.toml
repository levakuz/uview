# uview ships as a wheel that carries its binary and nothing to import (ADR-0017). maturin
# builds it from Cargo.toml, which also holds the version.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "uview"
dynamic = ["version"]
description = "A terminal UI for uv, the Python package manager"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Only pip reads it: the wheel holds no Python code. As uv's own.
requires-python = ">=3.8"
keywords = ["uv", "tui", "terminal", "packaging", "dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "flask>=3.0.3",
]

[project.urls]
Repository = "https://github.com/levakuz/uview"
Issues = "https://github.com/levakuz/uview/issues"

[tool.maturin]
bindings = "bin"
